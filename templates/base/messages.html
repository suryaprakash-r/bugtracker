{% if messages %}
<div class="app-messages">
    {% for message in messages %}
    <div class="app-message {{ message.tags }}" role="alert">

        <i class="bi bi-check-circle-fill"></i>

        <span>{{ message }}</span>

        <button type="button"
                class="app-message-close"
                aria-label="Close notification">
            <i class="bi bi-x"></i>
        </button>

    </div>
    {% endfor %}
</div>
{% endif %}
