{% extends "base/base.html" %}

{% block title %}
Edit Profile | BugTracker
{% endblock %}

{% block navbar_title %}
Edit Profile
{% endblock %}

{% block content %}

<h1>Edit Profile</h1>

    <form
        method="post"
        enctype="multipart/form-data"
    >

        {% csrf_token %}

        <div>
            <label>
                Phone
            </label>

            <input
                type="text"
                name="phone"
                value="{{ profile.phone }}"
            >
        </div>

        <br>

        <div>
            <label>
                Designation
            </label>

            <input
                type="text"
                name="designation"
                value="{{ profile.designation }}"
            >
        </div>

        <br>

        <div>
            <label>
                Department
            </label>

            <input
                type="text"
                name="department"
                value="{{ profile.department }}"
            >
        </div>

        <br>

        <div>
            <label>
                Bio
            </label>

            <textarea
                name="bio"
                rows="5"
            >{{ profile.bio }}</textarea>
        </div>

        <br>

        <div>
            <label>
                Profile Image
            </label>

            <input
                type="file"
                name="profile_image"
                accept="image/*"
            >
        </div>

        <br>

        <button type="submit">
            Save Changes
        </button>

    </form>

    <br>

    <a href="{% url 'accounts:profile' %}">
        Cancel
    </a>

{% endblock %}
